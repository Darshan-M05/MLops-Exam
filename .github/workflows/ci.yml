name: Automated-HTTP-Validation
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  validate-http:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate HTTP Response
        run: npx --yes html-validate index.html
